<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>KomisyonCep</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2B2118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KomisyonCep">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<style>
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: #2B2118;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    color: #2B2118;
    -webkit-tap-highlight-color: transparent;
  }
  .disp { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; letter-spacing: -0.01em; }

  /* Header */
  .header { background:#2B2118; padding:32px 20px 24px; border-bottom:4px dashed #4A7A3F; position:relative; }
  .hamburger { position:absolute; left:20px; top:32px; background:none; border:none; padding:6px; display:flex; flex-direction:column; gap:5px; border-radius:8px; }
  .hamburger span { width:24px; height:3px; background:#FFFFFF; border-radius:2px; display:block; }
  .header-center { text-align:center; }
  .eyebrow { color:#C1442E; font-size:12px; text-transform:uppercase; font-weight:700; letter-spacing:0.08em; }
  .header h1 { color:#F7F3E8; font-size:24px; margin:4px 0 0; }
  .header p { color:#B8A98A; font-size:14px; margin:4px 0 0; }

  /* Drawer */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40; display:none; }
  .overlay.show { display:block; }
  .drawer { position:fixed; top:0; left:0; height:100%; width:260px; background:#1A140D; z-index:50;
    border-right:4px solid #C1442E; transform:translateX(-100%); transition:transform 0.2s ease; }
  .drawer.open { transform:translateX(0); }
  .drawer-title { color:#F7F3E8; font-weight:700; font-size:18px; padding:32px 20px 24px; border-bottom:1px solid #3A2E20; }
  .drawer-item { display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #3A2E20;
    color:#B8A98A; font-size:16px; font-weight:500; padding:16px 20px; }
  .drawer-item.active { background:#3A2E20; color:#F7F3E8; }

  /* Content */
  .content { padding:20px 16px 10px; display:flex; flex-direction:column; gap:16px; }
  .content.with-bar { padding-bottom:160px; }

  .card { position:relative; background:#F7F3E8; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,0.25); overflow:hidden; }
  .card-pad { padding:16px; }
  .row-notch { position:absolute; left:-8px; top:16px; width:16px; height:16px; background:#2B2118; border-radius:50%; }

  .row-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; }
  .row-head .tag { color:#C1442E; font-weight:700; font-size:14px; }
  .icon-btn { background:none; border:none; color:#8A7A5E; font-size:16px; padding:4px; }

  .select-date-row { display:flex; border-bottom:1px solid #D9CBA8; }
  .select-wrap { position:relative; flex:1; min-width:0; }
  select.urun-select {
    width:100%; appearance:none; -webkit-appearance:none; background:transparent; border:none;
    padding:0 16px 10px; font-size:16px; font-weight:500; color:#2B2118; outline:none;
  }
  .chevron { pointer-events:none; position:absolute; right:16px; top:6px; color:#A89878; }
  .date-wrap { flex-shrink:0; width:118px; border-left:1px solid #D9CBA8; padding:0 10px 10px 12px; }
  .date-input {
    width:100%; background:transparent; border:none; outline:none;
    font-size:14px; font-weight:600; color:#2B2118; padding:0;
  }

  .name-input {
    width:100%; background:transparent; border:none; border-bottom:1px solid #D9CBA8;
    padding:0 16px 10px; font-size:16px; font-weight:500; color:#2B2118; outline:none;
  }
  .name-input::placeholder { color:#A89878; }

  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1px solid #D9CBA8; }
  .grid3 > div { padding:10px 12px; border-left:1px solid #D9CBA8; }
  .grid3 > div:first-child { border-left:none; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid #D9CBA8; }
  .grid2 > div { padding:10px 12px; border-left:1px solid #D9CBA8; }
  .grid2 > div:first-child { border-left:none; }
  select.kalite-select { width:100%; appearance:none; -webkit-appearance:none; background:transparent; border:none; outline:none; font-size:15px; font-weight:600; color:#2B2118; }
  .field-label { font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:#A89878; margin-bottom:2px; }
  .field-input { width:100%; background:transparent; border:none; outline:none; font-size:16px; font-weight:600; color:#2B2118; }
  .field-input::placeholder { color:#A89878; }

  .lines { padding:12px 16px; display:flex; flex-direction:column; gap:4px; }
  .line { display:flex; justify-content:space-between; font-size:14px; }
  .line .lbl { color:#5C4A34; }
  .line .lbl.muted { color:#A89878; }
  .line .val { color:#2B2118; font-weight:500; }
  .line .val.muted { color:#B0664F; }
  .line .val.strong { color:#2B6B24; font-weight:700; font-size:16px; }
  .hr { height:1px; background:#D9CBA8; margin:4px 0; }

  .btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:10px; border:none; font-weight:700; font-size:15px; width:100%; }
  .btn-outline { background:none; border:2px dashed #5C4A34; color:#E8D9B8; }
  .btn-green { background:#4A7A3F; color:#F7F3E8; }
  .btn-red { background:#C1442E; color:#F7F3E8; }
  .btn-small { width:auto; padding:10px 18px; border-radius:10px; border:none; font-weight:700; font-size:14px; background:#4A7A3F; color:#F7F3E8; }

  .saved-msg { background:#4A7A3F; color:#F7F3E8; font-size:14px; font-weight:600; border-radius:10px; padding:12px; text-align:center; }

  .sticky-bar { position:fixed; bottom:0; left:0; right:0; background:#1A140D; border-top:4px solid #C1442E; padding:16px 20px; }
  .sbar-row { display:flex; justify-content:space-between; align-items:baseline; }
  .sbar-label { color:#B8A98A; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  .sbar-val { color:#F7F3E8; font-weight:500; }
  .sbar-val.warn { color:#E8A33D; }
  .sbar-total { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; padding-top:8px; border-top:1px solid #3A2E20; }
  .sbar-total .lbl { color:#F7F3E8; font-weight:700; font-size:17px; }
  .sbar-total .val { color:#4A9A3F; font-weight:700; font-size:24px; }

  .empty-note { color:#8A7A5E; font-size:14px; padding:0 4px; }

  .add-row { display:flex; gap:8px; }
  .add-row input { flex:1; background:transparent; border:none; border-bottom:1px solid #D9CBA8; outline:none; font-size:16px; padding-bottom:6px; color:#2B2118; }
  .add-row input::placeholder { color:#A89878; }

  .prod-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .prod-name { color:#C1442E; font-weight:700; font-size:16px; }

  .txn { background:#F7F3E8; border-radius:10px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .txn-desc { color:#2B2118; font-weight:500; font-size:14px; }
  .txn-meta { color:#A89878; font-size:12px; }
  .txn-amt { font-weight:700; }
  .txn-amt.plus { color:#2B6B24; }
  .txn-amt.minus { color:#B0664F; }
  .txn-del { background:none; border:none; color:#C9BB98; font-size:14px; padding:0 4px; }

  .section-label { color:#B8A98A; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; margin:4px 4px; }

  /* Yazdırılabilir makbuz */
  .receipt-print { display:none; }
  @media print {
    body > *:not(.receipt-print) { display:none !important; }
    .receipt-print { display:block !important; padding:28px; color:#111; background:#fff; font-family:-apple-system,sans-serif; }
    .receipt-print h2 { margin:0 0 2px; font-size:20px; }
    .receipt-print .rp-sub { color:#555; font-size:13px; margin-bottom:18px; }
    .receipt-print table { width:100%; border-collapse:collapse; font-size:14px; }
    .receipt-print td { padding:6px 0; border-bottom:1px solid #ddd; }
    .receipt-print td.rp-label { color:#555; }
    .receipt-print td.rp-val { text-align:right; font-weight:600; }
    .receipt-print .rp-total td { font-size:17px; font-weight:800; border-top:2px solid #111; border-bottom:none; padding-top:10px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="receiptPrint" class="receipt-print"></div>

<script>
(function () {
  "use strict";

  /* ---------- FIREBASE ---------- */
  var firebaseConfig = {
    apiKey: "AIzaSyDJxYtgMfPRiaDxabLRSnmvNJL5JjdzwD0",
    authDomain: "komisyoncep.firebaseapp.com",
    projectId: "komisyoncep",
    storageBucket: "komisyoncep.firebasestorage.app",
    messagingSenderId: "789546692165",
    appId: "1:789546692165:web:57acba9cafb4418f6bfd2c"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}

  var LS_LEDGER = "hal_defteri_v1";
  var LS_URUNLER = "hal_urunler_v1";
  var LS_SEZONLAR = "hal_sezonlar_v1";
  var LS_ORTAKCILAR = "hal_ortakcilar_v1";

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var currentUser = null;
  var saveTimer = null;
  var canliDinleyici = null;

  function canliDinlemeyiBaslat() {
    canliDinlemeyiDurdur();
    var ref = userDoc();
    if (!ref) return;
    canliDinleyici = ref.onSnapshot(function (snap) {
      // Kendi yazdığımız değişikliği geri okumaya gerek yok
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) return;
      // Kullanıcı o an bir şey yazıyorsa (kaydetme bekliyorsa) ezme
      if (saveTimer) return;
      var d = snap.data() || {};
      var yeni = JSON.stringify([d.ledger, d.urunler, d.sezonlar, d.ortakcilar]);
      var eski = JSON.stringify([state.ledger, state.urunler, state.sezonlar, state.ortakcilar]);
      if (yeni === eski) return;
      state.ledger = Array.isArray(d.ledger) ? d.ledger : [];
      state.urunler = Array.isArray(d.urunler) ? d.urunler : [];
      state.sezonlar = Array.isArray(d.sezonlar) ? d.sezonlar : [];
      state.ortakcilar = Array.isArray(d.ortakcilar) ? d.ortakcilar : [];
      saveJSON(LS_LEDGER, state.ledger);
      saveJSON(LS_URUNLER, state.urunler);
      saveJSON(LS_SEZONLAR, state.sezonlar);
      saveJSON(LS_ORTAKCILAR, state.ortakcilar);
      render();
    }, function () {});
  }

  function canliDinlemeyiDurdur() {
    if (canliDinleyici) { try { canliDinleyici(); } catch (e) {} canliDinleyici = null; }
  }

  function userDoc() {
    return currentUser ? db.collection("users").doc(currentUser.uid) : null;
  }

  function buluttanYukle() {
    var ref = userDoc();
    if (!ref) return Promise.resolve(false);
    return ref.get().then(function (snap) {
      if (snap.exists) {
        var d = snap.data() || {};
        state.ledger = Array.isArray(d.ledger) ? d.ledger : [];
        state.urunler = Array.isArray(d.urunler) ? d.urunler : [];
        state.sezonlar = Array.isArray(d.sezonlar) ? d.sezonlar : [];
        state.ortakcilar = Array.isArray(d.ortakcilar) ? d.ortakcilar : [];
        state.rol = d.rol || "tek";
        state.bagliEposta = d.bagliEposta || "";
        state.naylonParasi = d.naylonParasi || 0;
        state.naylonlar = d.naylonlar || {};
        state.ad = d.ad || "";
        state.arazi = d.arazi || 0;
        state.araziBirim = d.araziBirim || "dönüm";
      } else {
        // İlk giriş: cihazdaki eski veriler varsa buluta taşı
        state.ledger = loadJSON(LS_LEDGER, []);
        state.urunler = loadJSON(LS_URUNLER, []);
        state.sezonlar = loadJSON(LS_SEZONLAR, []);
        state.ortakcilar = loadJSON(LS_ORTAKCILAR, []);
        return buluteKaydet(true).then(function () { return true; });
      }
      return true;
    }).catch(function () {
      // İnternet yoksa yerel önbellekten devam
      state.ledger = loadJSON(LS_LEDGER, []);
      state.urunler = loadJSON(LS_URUNLER, []);
      state.sezonlar = loadJSON(LS_SEZONLAR, []);
        state.ortakcilar = loadJSON(LS_ORTAKCILAR, []);
      return false;
    });
  }

  function buluteKaydet(hemen) {
    // Yerel önbelleğe her zaman yaz (offline güvence)
    saveJSON(LS_LEDGER, state.ledger);
    saveJSON(LS_URUNLER, state.urunler);
    saveJSON(LS_SEZONLAR, state.sezonlar);
    saveJSON(LS_ORTAKCILAR, state.ortakcilar);

    var ref = userDoc();
    if (!ref) return Promise.resolve();

    var yaz = function () {
      return ref.set({
        ledger: state.ledger,
        urunler: state.urunler,
        sezonlar: state.sezonlar,
        ortakcilar: state.ortakcilar,
        rol: state.rol,
        email: (currentUser && currentUser.email) ? currentUser.email.toLowerCase() : "",
        bagliEposta: state.bagliEposta,
        naylonParasi: state.naylonParasi,
        naylonlar: state.naylonlar,
        ad: state.ad,
        arazi: state.arazi,
        araziBirim: state.araziBirim,
        paylasilanEpostalar: paylasimListesi(),
        guncellendi: Date.now()
      }, { merge: true }).catch(function () {});
    };

    if (hemen) return yaz();

    // Arka arkaya değişikliklerde tek yazma yapsın diye kısa gecikme
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(yaz, 800);
    return Promise.resolve();
  }

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function bugun() {
    var d = new Date();
    return d.toLocaleDateString("tr-TR");
  }
  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function isoToTr(iso) {
    var parts = String(iso || "").split("-");
    if (parts.length !== 3) return bugun();
    return parts[2] + "." + parts[1] + "." + parts[0];
  }
  function tl(n) { return (n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function kgFmt(n) { return (n || 0).toLocaleString("tr-TR", { maximumFractionDigits: 2 }); }
  function parseNum(str) { return parseFloat(String(str || "").replace(/\./g, "").replace(",", ".")) || 0; }
  function formatInput(raw) {
    var value = String(raw || "").replace(/[^0-9,]/g, "");
    var commaIndex = value.indexOf(",");
    if (commaIndex !== -1) {
      value = value.slice(0, commaIndex + 1) + value.slice(commaIndex + 1).replace(/,/g, "");
    }
    var parts = value.split(",");
    var intPart = parts[0] || "";
    var decPart = parts.length > 1 ? parts[1] : undefined;
    intPart = intPart.replace(/^0+(?=\d)/, "");
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return decPart !== undefined ? intPart + "," + decPart : intPart;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- GİRİŞ / KAYIT ---------- */
  var authMod = "giris";      // "giris" | "kayit"
  var authHata = "";
  var authMesgul = false;
  var authEmail = "";
  var authSifre = "";
  var authKod = "";
  var authRol = "tek";   // "tek" | "ortakci" | "sahip"

  var ROLLER = [
    { v: "tek",     ad: "Tek Başıma",  aciklama: "Ortağım yok. Tüm hesap bana ait." },
    { v: "ortakci", ad: "Ortakçı",     aciklama: "Mal girişini ben yaparım, yer sahibiyle bölüşürüz." },
    { v: "sahip",   ad: "Yer Sahibi",  aciklama: "Mal girişi yapmam, ortakçıdan payımı takip ederim." }
  ];

  function rolSecenekleriHtml(secili, idOnEk) {
    return '<div style="display:flex;flex-direction:column;gap:8px;">' +
      ROLLER.map(function (r) {
        var aktif = secili === r.v;
        return '<button id="' + idOnEk + "-" + r.v + '" style="text-align:left;padding:10px 12px;border-radius:8px;border:2px solid ' +
          (aktif ? "#4A7A3F" : "#D9CBA8") + ';background:' + (aktif ? "#4A7A3F" : "transparent") + ';">' +
          '<div style="font-weight:700;font-size:14px;color:' + (aktif ? "#F7F3E8" : "#2B2118") + ';">' + r.ad + "</div>" +
          '<div style="font-size:11px;margin-top:2px;line-height:1.35;color:' + (aktif ? "#D9CBA8" : "#A89878") + ';">' + r.aciklama + "</div>" +
        "</button>";
      }).join("") +
    "</div>";
  }

  function rolSecenekleriniBagla(idOnEk, seciliyorsa) {
    ROLLER.forEach(function (r) {
      var b = document.getElementById(idOnEk + "-" + r.v);
      if (b) b.addEventListener("click", function () { seciliyorsa(r.v); });
    });
  }

  function renderAuth() {
    var kayitMi = authMod === "kayit";
    document.getElementById("root").innerHTML =
      '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">' +
        '<div class="eyebrow" style="margin-bottom:6px;">KomisyonCep</div>' +
        '<h1 style="color:#F7F3E8;font-size:22px;margin:0 0 8px;text-align:center;">' + (kayitMi ? "Hesap Oluştur" : "Giriş Yap") + "</h1>" +
        '<p style="color:#B8A98A;font-size:14px;text-align:center;margin:0 0 20px;max-width:290px;">' +
          (kayitMi ? "Satın aldığında sana verilen erişim kodunu gir." : "Hesabınla giriş yap, verilerin bulutta saklanır.") +
        "</p>" +
        '<div class="card card-pad" style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;">' +
          '<div>' +
            '<div class="field-label" style="margin-bottom:4px;">E-posta</div>' +
            '<input id="authEmail" type="email" inputmode="email" autocapitalize="none" autocorrect="off" placeholder="ornek@mail.com" value="' + esc(authEmail) + '" style="width:100%;background:transparent;border:none;border-bottom:1px solid #D9CBA8;padding-bottom:8px;font-size:16px;color:#2B2118;outline:none;">' +
          "</div>" +
          '<div>' +
            '<div class="field-label" style="margin-bottom:4px;">Şifre</div>' +
            '<input id="authSifre" type="password" placeholder="En az 6 karakter" value="' + esc(authSifre) + '" style="width:100%;background:transparent;border:none;border-bottom:1px solid #D9CBA8;padding-bottom:8px;font-size:16px;color:#2B2118;outline:none;">' +
          "</div>" +
          (kayitMi ?
            '<div>' +
              '<div class="field-label" style="margin-bottom:8px;">Hesap Türü</div>' +
              rolSecenekleriHtml(authRol, "kayitRol") +
            "</div>" +
            '<div>' +
              '<div class="field-label" style="margin-bottom:4px;">Erişim Kodu</div>' +
              '<input id="authKod" autocapitalize="characters" autocorrect="off" placeholder="Sana verilen kod" value="' + esc(authKod) + '" style="width:100%;background:transparent;border:none;border-bottom:1px solid #D9CBA8;padding-bottom:8px;font-size:16px;color:#2B2118;outline:none;text-transform:uppercase;">' +
            "</div>" : "") +
          (authHata ? '<div style="color:#C1442E;font-size:13px;font-weight:600;line-height:1.4;">' + esc(authHata) + "</div>" : "") +
          '<button class="btn btn-green" id="authBtn">' + (authMesgul ? "Lütfen bekle..." : (kayitMi ? "Hesabı Oluştur" : "Giriş Yap")) + "</button>" +
          '<button id="authModBtn" style="background:none;border:none;color:#5C4A34;font-size:13px;text-decoration:underline;padding:4px;">' +
            (kayitMi ? "Zaten hesabım var, giriş yap" : "Hesabım yok, kod ile kayıt ol") +
          "</button>" +
          (kayitMi ? "" : '<button id="sifreSifirlaBtn" style="background:none;border:none;color:#A89878;font-size:12px;padding:2px;">Şifremi unuttum</button>') +
        "</div>" +
      "</div>";

    var emailInp = document.getElementById("authEmail");
    var sifreInp = document.getElementById("authSifre");
    var kodInp = document.getElementById("authKod");
    emailInp.addEventListener("input", function () { authEmail = emailInp.value; });
    sifreInp.addEventListener("input", function () { authSifre = sifreInp.value; });
    if (kodInp) kodInp.addEventListener("input", function () { authKod = kodInp.value; });
    sifreInp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !kayitMi) authGonder(); });

    document.getElementById("authBtn").addEventListener("click", authGonder);
    document.getElementById("authModBtn").addEventListener("click", function () {
      authMod = kayitMi ? "giris" : "kayit";
      authHata = "";
      renderAuth();
    });
    var sifirla = document.getElementById("sifreSifirlaBtn");
    if (sifirla) sifirla.addEventListener("click", sifreSifirla);
    rolSecenekleriniBagla("kayitRol", function (v) { authRol = v; renderAuth(); });
  }

  function authHataMetni(err) {
    var kod = (err && err.code) || "";
    if (kod === "auth/invalid-email") return "E-posta adresi geçersiz.";
    if (kod === "auth/email-already-in-use") return "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.";
    if (kod === "auth/weak-password") return "Şifre en az 6 karakter olmalı.";
    if (kod === "auth/wrong-password" || kod === "auth/invalid-credential") return "E-posta veya şifre hatalı.";
    if (kod === "auth/user-not-found") return "Bu e-posta ile kayıtlı hesap yok.";
    if (kod === "auth/too-many-requests") return "Çok fazla deneme yapıldı, biraz bekleyip tekrar dene.";
    if (kod === "auth/network-request-failed") return "İnternet bağlantısı yok.";
    return (err && err.message) ? err.message : "Bir hata oluştu, tekrar dene.";
  }

  function sifreSifirla() {
    var mail = String(authEmail || "").trim();
    if (!mail) { authHata = "Önce e-posta adresini yaz, sonra bu butona bas."; renderAuth(); return; }
    auth.sendPasswordResetEmail(mail).then(function () {
      authHata = "";
      alert("Şifre sıfırlama bağlantısı " + mail + " adresine gönderildi.");
    }).catch(function (err) {
      authHata = authHataMetni(err);
      renderAuth();
    });
  }

  function authGonder() {
    if (authMesgul) return;
    var mail = String(authEmail || "").trim();
    var sifre = String(authSifre || "");
    if (!mail || !sifre) { authHata = "E-posta ve şifre gerekli."; renderAuth(); return; }

    authMesgul = true;
    authHata = "";
    renderAuth();

    if (authMod === "giris") {
      auth.signInWithEmailAndPassword(mail, sifre).catch(function (err) {
        authMesgul = false;
        authHata = authHataMetni(err);
        renderAuth();
      });
      return;
    }

    // KAYIT: önce kodu doğrula, sonra hesabı aç, sonra kodu kullanılmış işaretle
    var kod = String(authKod || "").trim().toUpperCase();
    if (!kod) { authMesgul = false; authHata = "Erişim kodu gerekli."; renderAuth(); return; }

    var kodRef = db.collection("kodlar").doc(kod);
    kodRef.get().then(function (snap) {
      if (!snap.exists) throw { code: "kod/yok" };
      var kd = snap.data() || {};
      if (kd.kullanildi || kd.Kullanildi) throw { code: "kod/kullanilmis" };
      return auth.createUserWithEmailAndPassword(mail, sifre);
    }).then(function (cred) {
      return db.collection("users").doc(cred.user.uid).set({
        rol: authRol,
        email: mail.toLowerCase(),
        paylasilanEpostalar: [],
        ledger: [], urunler: [], sezonlar: [], ortakcilar: []
      }, { merge: true }).then(function () { return cred; });
    }).then(function (cred) {
      return kodRef.set({
        kullanildi: true,
        uid: cred.user.uid,
        email: mail,
        kullanimTarihi: Date.now()
      }, { merge: true });
    }).catch(function (err) {
      authMesgul = false;
      if (err && err.code === "kod/yok") authHata = "Bu erişim kodu geçersiz.";
      else if (err && err.code === "kod/kullanilmis") authHata = "Bu kod daha önce kullanılmış. Kendi hesabınla giriş yap.";
      else authHata = authHataMetni(err);
      renderAuth();
    });
  }

  function cikisYap() {
    if (!confirm("Çıkış yapmak istiyor musun? Verilerin bulutta güvende kalır.")) return;
    buluteKaydet(true).then(function () {
      return auth.signOut();
    });
  }

  function startApp() {
    document.getElementById("root").innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#B8A98A;font-size:14px;">Yükleniyor...</div>';

    auth.onAuthStateChanged(function (user) {
      currentUser = user;
      if (!user) {
        canliDinlemeyiDurdur();
        authMesgul = false;
        authSifre = "";
        authKod = "";
        renderAuth();
        return;
      }
      buluttanYukle().then(function () {
        return karsiTarafiYukle();
      }).then(function () {
        state.view = (state.rol === "sahip") ? "ortaklik" : "calc";
        state.rows = [newRow()];
        state.ayarMesaj = "";
        render();
        canliDinlemeyiBaslat();
      });
    });
  }

  function newRow() { return { id: uid(), urun: "", kg: "", fiyat: "", oran: "13", tarih: todayISO(), kalite: "Standart" }; }

  var state = {
    view: "calc",
    drawerOpen: false,
    rows: [newRow()],
    ledger: [],
    urunler: [],
    sezonlar: [],
    ortakcilar: [],
    rol: "tek",
    bagliEposta: "",
    naylonParasi: 0,
    naylonlar: {},
    ad: "",
    karsiTaraflar: [],
    acikOrtakciEposta: null,
    arazi: 0,
    araziBirim: "dönüm",
    karsiTaraf: null,
    ayarMesaj: "",
    sezonAcikId: null,
    savedMsg: false,
    odemeOpen: false,
    odemeTutar: "",
    odemeAciklama: "",
    bakiyeOpen: false,
    bakiyeTutar: "",
    bakiyeAciklama: "",
    giderOpen: false,
    giderTur: "isci",
    giderTutar: "",
    giderAciklama: "",
    yeniUrunAd: "",
  };

  function persistLedger() { buluteKaydet(); }
  function persistUrunler() { buluteKaydet(); }
  function persistSezonlar() { buluteKaydet(); }

  function calcRow(r) {
    var kg = parseNum(r.kg);
    var fiyat = parseNum(r.fiyat);
    var oran = parseNum(r.oran);
    var tutar = kg * fiyat;
    var komisyon = tutar * (oran / 100);
    var net = tutar - komisyon;
    return { kg: kg, fiyat: fiyat, oran: oran, tutar: tutar, komisyon: komisyon, net: net };
  }

  /* ---------- RENDER: SHELL ---------- */

  function render() {
    // Rol değişince erişilemeyen bir ekranda kalmayı önle
    if (state.rol === "sahip" && ["calc", "urunler", "gecmis"].indexOf(state.view) !== -1) state.view = "ortaklik";
    if (state.rol === "tek" && state.view === "ortaklik") state.view = "calc";
    var root = document.getElementById("root");
    root.innerHTML = renderDrawer() + renderHeader() + renderContent();
    bindEvents();
  }

  function renderDrawer() {
    var items;
    if (state.rol === "sahip") {
      items = [
        { v: "ortaklik", label: "🤝 Ortaklık Hesabım" },
        { v: "kasa", label: "💰 Kasa Defterim" },
        { v: "grafikler", label: "📊 Grafikler" },
        { v: "ayarlar", label: "⚙️ Ayarlar" }
      ];
    } else {
      items = [
        { v: "calc", label: "🧮 Fiş Hesapla" },
        { v: "kasa", label: "💰 Kasa Defterim" },
        { v: "urunler", label: "📦 Ürünlerim" }
      ];
      if (state.rol === "ortakci") items.push({ v: "ortaklik", label: "🤝 Ortaklık Hesabım" });
      items.push({ v: "gecmis", label: "📜 Geçmiş Sezonlar" });
      items.push({ v: "grafikler", label: "📊 Grafikler" });
      items.push({ v: "ayarlar", label: "⚙️ Ayarlar" });
    }
    var itemsHtml = items.map(function (it) {
      return '<button class="drawer-item ' + (state.view === it.v ? "active" : "") + '" data-view="' + it.v + '">' + it.label + "</button>";
    }).join("");
    return (
      '<div class="overlay ' + (state.drawerOpen ? "show" : "") + '" id="overlay"></div>' +
      '<div class="drawer ' + (state.drawerOpen ? "open" : "") + '">' +
        '<div class="drawer-title">Menü' +
          (currentUser && currentUser.email ? '<div style="color:#8A7A5E;font-size:11px;font-weight:400;margin-top:6px;word-break:break-all;">' + esc(currentUser.email) + "</div>" : "") +
        "</div>" +
        itemsHtml +
        '<button class="drawer-item" id="cikisBtn" style="color:#C1442E;">🚪 Çıkış Yap</button>' +
      "</div>"
    );
  }

  function renderHeader() {
    var titles = { calc: "Komisyon Hesaplayıcı", kasa: "Kasa Defterim", urunler: "Ürünlerim", gecmis: "Geçmiş Sezonlar", grafikler: "Grafikler", ortaklik: "Ortaklık Hesabım", ayarlar: "Ayarlar" };
    var subs = {
      calc: "Kg, fiyat ve komisyon oranını gir.",
      kasa: "Ne kazandın, ne aldın, ne kaldı.",
      urunler: "Ürün bazında kg ve kazanç.",
      gecmis: "Önceki sezonların özeti.",
      grafikler: "Bu sezon ve geçen sezon karşılaştırması.",
      ortaklik: state.rol === "sahip" ? "Ortakçından sana düşen pay." : "Yer sahibiyle ortaklık hesabın.",
      ayarlar: "Hesap türü ve bağlantı ayarları."
    };
    return (
      '<div class="header">' +
        '<button class="hamburger" id="menuBtn"><span></span><span></span><span></span></button>' +
        '<div class="header-center">' +
          '<div class="eyebrow">KomisyonCep</div>' +
          "<h1>" + titles[state.view] + "</h1>" +
          "<p>" + subs[state.view] + "</p>" +
        "</div>" +
      "</div>"
    );
  }

  function renderContent() {
    if (state.view === "calc") return renderCalc();
    if (state.view === "kasa") return renderKasa();
    if (state.view === "urunler") return renderUrunler();
    if (state.view === "gecmis") return renderGecmisSezonlar();
    if (state.view === "ortaklik") return renderOrtaklik();
    if (state.view === "ayarlar") return renderAyarlar();
    return renderGrafikler();
  }

  /* ---------- HESAPLA ---------- */

  function renderCalc() {
    var rowsHtml = state.rows.map(function (r, idx) {
      var c = calcRow(r);
      var options = '<option value="">' + (state.urunler.length === 0 ? "Önce Ürünlerim'den ekle" : "Ürün seç...") + "</option>";
      options += state.urunler.map(function (u) {
        return '<option value="' + esc(u) + '" ' + (r.urun === u ? "selected" : "") + ">" + esc(u) + "</option>";
      }).join("");
      return (
        '<div class="card">' +
          '<div class="row-notch"></div>' +
          '<div class="row-head">' +
            '<span class="tag">KASA #' + (idx + 1) + "</span>" +
            '<button class="icon-btn" data-remove-row="' + r.id + '">✕</button>' +
          "</div>" +
          '<div class="select-date-row">' +
            '<div class="select-wrap">' +
              '<select class="urun-select" data-row="' + r.id + '" data-field="urun">' + options + "</select>" +
              '<span class="chevron">▾</span>' +
            "</div>" +
            '<div class="date-wrap">' +
              '<input type="date" class="date-input" value="' + esc(r.tarih || todayISO()) + '" data-row="' + r.id + '" data-field="tarih">' +
            "</div>" +
          "</div>" +
          '<div class="grid3">' +
            '<div><div class="field-label">Kg</div><input class="field-input" inputmode="decimal" placeholder="0" value="' + esc(r.kg) + '" data-row="' + r.id + '" data-field="kg"></div>' +
            '<div><div class="field-label">Fiyat ₺/kg</div><input class="field-input" inputmode="decimal" placeholder="0" value="' + esc(r.fiyat) + '" data-row="' + r.id + '" data-field="fiyat"></div>' +
            '<div><div class="field-label">Komisyon %</div><input class="field-input" inputmode="decimal" placeholder="0" value="' + esc(r.oran) + '" data-row="' + r.id + '" data-field="oran"></div>' +
          "</div>" +
          '<div style="padding:10px 16px;border-bottom:1px solid #D9CBA8;">' +
            '<div class="field-label">Kalite</div>' +
            '<select class="kalite-select" data-row="' + r.id + '" data-field="kalite">' +
              ["Standart","1. Kalite","2. Kalite","3. Kalite"].map(function (k) {
                return '<option value="' + k + '" ' + (r.kalite === k ? "selected" : "") + ">" + k + "</option>";
              }).join("") +
            "</select>" +
          "</div>" +
          '<div class="lines">' +
            '<div class="line"><span class="lbl">Tutar</span><span class="val" id="tutar-' + r.id + '">' + tl(c.tutar) + " ₺</span></div>" +
            '<div class="line"><span class="lbl muted" id="komisyonLbl-' + r.id + '">Komisyon (%' + (c.oran || 0) + ')</span><span class="val muted" id="komisyon-' + r.id + '">− ' + tl(c.komisyon) + " ₺</span></div>" +
            '<div class="hr"></div>' +
            '<div class="line"><span class="lbl">Net (üreticiye)</span><span class="val strong" id="net-' + r.id + '">' + tl(c.net) + " ₺</span></div>" +
          "</div>" +
        "</div>"
      );
    }).join("");

    var totals = state.rows.reduce(function (acc, r) {
      var c = calcRow(r);
      acc.kg += c.kg; acc.komisyon += c.komisyon; acc.net += c.net;
      return acc;
    }, { kg: 0, komisyon: 0, net: 0 });

    return (
      '<div class="content with-bar">' +
        (state.savedMsg ? '<div class="saved-msg">✓ Kasaya kaydedildi</div>' : "") +
        rowsHtml +
        '<button class="btn btn-outline" id="addRowBtn">+ Ürün Ekle</button>' +
      "</div>" +
      '<div class="sticky-bar">' +
        '<div class="sbar-row"><span class="sbar-label">Toplam Kg</span><span class="sbar-val" id="sumKg">' + kgFmt(totals.kg) + " kg</span></div>" +
        '<div class="sbar-row"><span class="sbar-label">Toplam Komisyon</span><span class="sbar-val warn" id="sumKomisyon">− ' + tl(totals.komisyon) + " ₺</span></div>" +
        '<div class="sbar-total"><span class="lbl">NET TUTAR</span><span class="val" id="sumNet">' + tl(totals.net) + " ₺</span></div>" +
        '<button class="btn btn-green" style="margin-top:12px" id="kaydetBtn">✓ BU FİŞİ KASAYA KAYDET</button>' +
      "</div>"
    );
  }

  function updateRowDisplay(rowId) {
    var row = state.rows.find(function (r) { return r.id === rowId; });
    if (!row) return;
    var c = calcRow(row);
    var tutarEl = document.getElementById("tutar-" + rowId);
    var komisyonEl = document.getElementById("komisyon-" + rowId);
    var komisyonLblEl = document.getElementById("komisyonLbl-" + rowId);
    var netEl = document.getElementById("net-" + rowId);
    if (tutarEl) tutarEl.textContent = tl(c.tutar) + " ₺";
    if (komisyonEl) komisyonEl.textContent = "− " + tl(c.komisyon) + " ₺";
    if (komisyonLblEl) komisyonLblEl.textContent = "Komisyon (%" + (c.oran || 0) + ")";
    if (netEl) netEl.textContent = tl(c.net) + " ₺";
    updateTotals();
  }

  function updateTotals() {
    var totals = state.rows.reduce(function (acc, r) {
      var c = calcRow(r);
      acc.kg += c.kg; acc.komisyon += c.komisyon; acc.net += c.net;
      return acc;
    }, { kg: 0, komisyon: 0, net: 0 });
    var kgEl = document.getElementById("sumKg");
    var komEl = document.getElementById("sumKomisyon");
    var netEl = document.getElementById("sumNet");
    if (kgEl) kgEl.textContent = kgFmt(totals.kg) + " kg";
    if (komEl) komEl.textContent = "− " + tl(totals.komisyon) + " ₺";
    if (netEl) netEl.textContent = tl(totals.net) + " ₺";
  }

  /* ---------- KASA DEFTERI ---------- */

  function araziSatiri(tutar) {
    if (!state.arazi || state.arazi <= 0) return "";
    var birim = state.araziBirim || "dönüm";
    var basina = tutar / state.arazi;
    return '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #D9CBA8;font-size:12px;color:#A89878;display:flex;justify-content:space-between;">' +
      "<span>" + kgFmt(state.arazi) + " " + birim + " · " + birim + " başına</span>" +
      '<span style="color:#5C4A34;font-weight:600;">' + tl(basina) + " ₺</span>" +
    "</div>";
  }

  function renderKasaSahip() {
    if (!state.karsiTaraflar || state.karsiTaraflar.length === 0) {
      return '<div class="content"><div class="empty-note">Kasanın çalışması için önce bir ortakçının seni yer sahibi olarak eklemesi gerekiyor. Senin e-postan: <b>' + esc(benimEposta()) + "</b></div></div>";
    }

    var pay = 0;
    state.karsiTaraflar.forEach(function (d) {
      pay += ortaklikHesabi(d.ledger || [], ortakciNaylon(d.email)).sahip.net;
    });

    var alinan = state.ledger.filter(function (t) { return t.tip === "odeme"; })
                             .reduce(function (s, t) { return s + t.tutar; }, 0);
    var kalan = pay - alinan;

    var formHtml = "";
    if (state.odemeOpen) {
      formHtml =
        '<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px;">' +
          '<div>' +
            '<div class="field-label" style="margin-bottom:4px;">Tutar (₺)</div>' +
            '<input class="name-input" style="border-bottom:1px solid #D9CBA8;padding-bottom:6px;" inputmode="decimal" placeholder="0" value="' + esc(state.odemeTutar) + '" id="odemeTutarInput">' +
          "</div>" +
          '<div>' +
            '<div class="field-label" style="margin-bottom:4px;">Açıklama (opsiyonel)</div>' +
            '<input class="name-input" style="border-bottom:1px solid #D9CBA8;padding-bottom:6px;" placeholder="örn. Nakit" value="' + esc(state.odemeAciklama) + '" id="odemeAciklamaInput">' +
          "</div>" +
          '<button class="btn btn-green" id="odemeKaydetBtn">Kaydet</button>' +
        "</div>";
    }

    var sirali = state.ledger.filter(function (t) { return t.tip === "odeme"; })
                             .sort(function (a, b) { return a.id < b.id ? 1 : -1; });
    var txnHtml = sirali.length === 0
      ? '<div class="empty-note">Henüz para çekme kaydı yok.</div>'
      : sirali.map(function (t) {
          return (
            '<div class="txn">' +
              '<div style="min-width:0;">' +
                '<div class="txn-desc">' + esc(t.aciklama) + "</div>" +
                '<div class="txn-meta">' + esc(t.tarih) + " · Para alındı</div>" +
              "</div>" +
              '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:8px;">' +
                '<span class="txn-amt minus">− ' + tl(t.tutar) + " ₺</span>" +
                '<button class="txn-del" data-del-txn="' + t.id + '">✕</button>' +
              "</div>" +
            "</div>"
          );
        }).join('<div style="height:8px"></div>');

    return (
      '<div class="content">' +
        '<div class="card card-pad">' +
          '<div class="line" style="margin-bottom:8px;"><span class="lbl">Ortaklık Payım</span><span class="val strong">' + tl(pay) + " ₺</span></div>" +
          '<div class="line" style="margin-bottom:8px;"><span class="lbl">Aldığım Para</span><span class="val muted">− ' + tl(alinan) + " ₺</span></div>" +
          '<div class="hr" style="margin:8px 0;"></div>' +
          '<div class="line"><span class="lbl" style="font-weight:700;font-size:16px;color:#2B2118;">KALAN ALACAĞIM</span>' +
            '<span style="font-weight:700;font-size:22px;color:' + (kalan >= 0 ? "#4A7A3F" : "#C1442E") + ';">' +
            (kalan < 0 ? "− " : "") + tl(Math.abs(kalan)) + " ₺</span></div>" +
          (kalan < 0 ? '<div style="font-size:12px;color:#C1442E;margin-top:4px;font-weight:600;">Payından fazla para almışsın.</div>' : "") +
          araziSatiri(pay) +
        "</div>" +
        '<button class="btn btn-red" id="odemeToggleBtn">+ PARA ALDIM</button>' +
        formHtml +
        '<div>' +
          '<div class="section-label">Hareketler</div>' +
          txnHtml +
        "</div>" +
      "</div>"
    );
  }

  function renderKasa() {
    if (state.rol === "sahip") return renderKasaSahip();
    var toplamSatis = state.ledger.filter(function (t) { return t.tip === "satis"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamBakiye = state.ledger.filter(function (t) { return t.tip === "bakiye"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamOdeme = state.ledger.filter(function (t) { return t.tip === "odeme"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamIsci = state.ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "isci"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamKira = state.ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "kira"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamIlac = state.ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "ilac"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var toplamFide = state.ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "fide"; }).reduce(function (s, t) { return s + t.tutar; }, 0);

            }
            var ktN = (state.karsiTaraf.naylonlar || {});
            var nay = (ktN[benimEposta()] != null) ? ktN[benimEposta()] : (state.karsiTaraf.naylonParasi || 0);
            var pay = ortaklikHesabi(state.ledger, nay).ortakci.net + toplamBakiye - toplamOdeme;
            return '<div class="line"><span class="lbl" style="font-weight:700;font-size:16px;color:#2B2118;">HALDE KALAN ALACAĞIM</span><span style="font-weight:700;font-size:22px;color:' + (pay >= 0 ? "#4A7A3F" : "#C1442E") + ';">' + (pay < 0 ? "− " : "") + tl(Math.abs(pay)) + " ₺</span></div>" +
              '<div style="font-size:11px;color:#A89878;margin-top:4px;display:flex;justify-content:space-between;"><span>Payıma düşen · toplam kasa</span><span>' + (kalan < 0 ? "− " : "") + tl(Math.abs(kalan)) + " ₺</span></div>";
          })() +

  function renderUrunler() {
    var map = {};
    state.ledger.filter(function (t) { return t.tip === "satis"; }).forEach(function (t) {
      var key = t.grup || "Diğer";
      if (!map[key]) map[key] = { kg: 0, tutar: 0 };
      map[key].kg += t.kg || 0;
      map[key].tutar += t.tutar || 0;
    });
    var tumAdlarSet = {};
    state.urunler.forEach(function (u) { tumAdlarSet[u] = true; });
    Object.keys(map).forEach(function (k) { tumAdlarSet[k] = true; });
    var liste = Object.keys(tumAdlarSet).map(function (ad) {
      var m = map[ad] || { kg: 0, tutar: 0 };
      return { ad: ad, kg: m.kg, tutar: m.tutar, tanimli: state.urunler.indexOf(ad) !== -1 };
    }).sort(function (a, b) { return b.tutar - a.tutar; });

    var cardsHtml = liste.length === 0
      ? '<div class="empty-note">Henüz ürün yok. Yukarıdan ekle, Fiş Hesapla ekranında listeden seçebilirsin.</div>'

          return (

                '<div class="prod-name">' + esc(g.ad) + "</div>" +

              '<div class="line" style="margin-top:4px;"><span class="lbl">Toplam Kazanç</span><span class="val strong">' + tl(g.tutar) + " ₺</span></div>" +

    return (
      '<div class="content">' +
        '<div class="card card-pad">' +
          '<div class="add-row">' +

  /* ---------- GECMIS SEZONLAR ---------- */

  /* ---------- ORTAKLIK HESABI ---------- */
  /* Kurallar:
     - Satışın %50'si yer sahibinin, %50'si ortakçının
     - İlaç ve fide giderleri yarı yarıya
     - İşçi parası tamamen ortakçının
     - Kira tamamen yer sahibinin
     - Naylon/çift parası: yer sahibi belirler, ortakçının kasasından düşülüp yer sahibine yazılır */

  function ortaklikHesabi(ledger, naylon) {
    var satis = 0, ilac = 0, fide = 0, isci = 0, kira = 0;
    (ledger || []).forEach(function (t) {
      if (t.tip === "satis") satis += t.tutar;
      else if (t.tip === "gider") {
        if (t.giderTur === "ilac") ilac += t.tutar;
        else if (t.giderTur === "fide") fide += t.tutar;
        else if (t.giderTur === "isci") isci += t.tutar;
        else if (t.giderTur === "kira") kira += t.tutar;
      }
    });
    naylon = naylon || 0;

    var ortakci = {
      satisPayi: satis / 2,
      ilacPayi: ilac / 2,
      fidePayi: fide / 2,
      isci: isci,
      naylon: naylon,
      net: (satis / 2) - (ilac / 2) - (fide / 2) - isci - naylon
    };
    var sahip = {
      satisPayi: satis / 2,
      ilacPayi: ilac / 2,
      fidePayi: fide / 2,
      kira: kira,
      naylon: naylon,
      net: (satis / 2) - (ilac / 2) - (fide / 2) - kira + naylon
    };
    return { satis: satis, ilac: ilac, fide: fide, isci: isci, kira: kira, ortakci: ortakci, sahip: sahip };
  }

  function benimEposta() {
    return ((currentUser && currentUser.email) || "").toLowerCase();
  }

  function paylasimListesi() {
    if (state.rol === "sahip") {
      // Yer sahibi: kendisine bağlanan tüm ortakçılarla paylaşır (naylon parasını okuyabilsinler)
      return (state.karsiTaraflar || []).map(function (d) { return d.email; }).filter(Boolean);
    }
    return state.bagliEposta ? [state.bagliEposta] : [];
  }

  function ortakciNaylon(eposta) {
    var m = state.naylonlar || {};
    if (m[eposta] != null) return m[eposta];
    return state.naylonParasi || 0; // eski tek-ortakçı verisi için yedek
  }

  function karsiTarafiYukle() {
    if (!currentUser) { state.karsiTaraf = null; state.karsiTaraflar = []; return Promise.resolve(); }
    return db.collection("users")
      .where("paylasilanEpostalar", "array-contains", benimEposta())
      .limit(30).get()
      .then(function (qs) {
        var hepsi = [];
        qs.forEach(function (doc) { hepsi.push(doc.data() || {}); });

        if (state.rol === "sahip") {
          // Bana bağlanan tüm ortakçılar
          state.karsiTaraflar = hepsi.filter(function (d) { return (d.rol || "") !== "sahip"; });
          state.karsiTaraf = state.karsiTaraflar.length ? state.karsiTaraflar[0] : null;
          // Ortakçılar naylon parasını okuyabilsin diye paylaşım listemi güncelle
          var gerekli = state.karsiTaraflar.map(function (d) { return d.email; }).filter(Boolean).sort().join(",");
          if (gerekli) {
            return db.collection("users").doc(currentUser.uid)
              .set({ paylasilanEpostalar: gerekli.split(",") }, { merge: true })
              .catch(function () {});
          }
          return null;
        }

        // Ortakçı: bağlı olduğu yer sahibini bul
        var bulunan = null;
        hepsi.forEach(function (d) {
          if ((d.email || "") === state.bagliEposta) bulunan = d;
        });
        state.karsiTaraf = bulunan;
        state.karsiTaraflar = bulunan ? [bulunan] : [];
        return null;
      })
      .catch(function () { state.karsiTaraf = null; state.karsiTaraflar = []; });
  }

  function urunDetayHtml(defter) {
    var map = {};
    (defter || []).filter(function (t) { return t.tip === "satis"; }).forEach(function (t) {
      var k = t.grup || "Diğer";
      if (!map[k]) map[k] = { kg: 0, tutar: 0 };
      map[k].kg += t.kg || 0;
      map[k].tutar += t.tutar || 0;
    });
    var liste = Object.keys(map).map(function (ad) {
      return { ad: ad, kg: map[ad].kg, tutar: map[ad].tutar };
    }).sort(function (a, b) { return b.tutar - a.tutar; });

    if (liste.length === 0) {
      return '<div class="card card-pad"><div class="empty-note">Henüz satış kaydı yok.</div></div>';
    }

    var toplamKg = 0, toplamTutar = 0;
    liste.forEach(function (u) { toplamKg += u.kg; toplamTutar += u.tutar; });

    return (
      '<div class="card card-pad">' +
        '<div class="prod-name" style="margin-bottom:10px;">Ürün Detayı</div>' +
        liste.map(function (u) {
          var ortKg = u.kg > 0 ? (u.tutar / u.kg) : 0;
          return (
            '<div style="padding:8px 0;border-bottom:1px solid #E5DCC5;">' +
              '<div style="font-weight:700;font-size:14px;color:#2B2118;margin-bottom:4px;">' + esc(u.ad) + "</div>" +
              '<div class="line" style="font-size:13px;"><span class="lbl">' + kgFmt(u.kg) + " kg × ort. " + tl(ortKg) + ' ₺/kg</span><span class="val">' + tl(u.tutar) + " ₺</span></div>" +
              '<div class="line" style="font-size:13px;margin-top:2px;"><span class="lbl muted">Bana düşen (%50)</span><span class="val strong">' + tl(u.tutar / 2) + " ₺</span></div>" +
            "</div>"
          );
        }).join("") +
        '<div style="padding-top:10px;">' +
          '<div class="line"><span class="lbl" style="font-weight:700;">Toplam</span><span class="val" style="font-weight:700;">' + kgFmt(toplamKg) + " kg · " + tl(toplamTutar) + " ₺</span></div>" +
          '<div class="line" style="margin-top:4px;"><span class="lbl" style="font-weight:700;">Toplam Payım</span><span class="val strong" style="font-size:17px;">' + tl(toplamTutar / 2) + " ₺</span></div>" +
        "</div>" +
      "</div>"
    );
  }

  function ortakciGorunenAd(d) {
    return (d && d.ad && d.ad.trim()) ? d.ad.trim() : ((d && d.email) || "İsimsiz");
  }

  function renderOrtaklikSahip() {
    if (!state.karsiTaraflar || state.karsiTaraflar.length === 0) {
      return '<div class="content"><div class="empty-note">Henüz bağlı ortakçı yok.<br><br>Ortakçının kendi uygulamasında <b>Ayarlar</b>\'a girip senin e-postanı (<b>' + esc(benimEposta()) + '</b>) yer sahibi olarak eklemesi gerekiyor. Ekledikten sonra burada görünecek.</div></div>';
    }

    // Detay sayfası açıksa
    if (state.acikOrtakciEposta) {
      var d = null;
      state.karsiTaraflar.forEach(function (x) { if (x.email === state.acikOrtakciEposta) d = x; });
      if (!d) { state.acikOrtakciEposta = null; }
      else {
        var naylon = ortakciNaylon(d.email);
        var h = ortaklikHesabi(d.ledger || [], naylon);
        var b = h.sahip;
        var sat = "";
        sat += '<div class="line" style="margin-bottom:8px;"><span class="lbl">Satış payım (%50)</span><span class="val strong">' + tl(b.satisPayi) + " ₺</span></div>";
        if (h.ilac > 0) sat += '<div class="line" style="margin-bottom:8px;"><span class="lbl">İlaç payım (yarısı)</span><span class="val muted">− ' + tl(b.ilacPayi) + " ₺</span></div>";
        if (h.fide > 0) sat += '<div class="line" style="margin-bottom:8px;"><span class="lbl">Fide payım (yarısı)</span><span class="val muted">− ' + tl(b.fidePayi) + " ₺</span></div>";
        if (h.kira > 0) sat += '<div class="line" style="margin-bottom:8px;"><span class="lbl">Kira (tamamı bende)</span><span class="val muted">− ' + tl(b.kira) + " ₺</span></div>";
        if (naylon > 0) sat += '<div class="line" style="margin-bottom:8px;"><span class="lbl">Naylon / çift parası</span><span class="val strong">+ ' + tl(naylon) + " ₺</span></div>";

        return (
          '<div class="content">' +
            '<button class="btn-small" id="ortakGeriBtn" style="width:100%;background:#5C4A34;">← Ortakçı Listesine Dön</button>' +
            '<div class="card card-pad">' +
              '<div class="prod-name" style="margin-bottom:2px;">' + esc(ortakciGorunenAd(d)) + "</div>" +
              '<div style="font-size:12px;color:#A89878;margin-bottom:10px;">' + esc(d.email || "") + "</div>" +
              sat +
              '<div class="hr" style="margin:8px 0;"></div>' +
              '<div class="line"><span class="lbl" style="font-weight:700;font-size:16px;color:#2B2118;">BU ORTAKÇIDAN PAYIM</span>' +
                '<span style="font-weight:700;font-size:22px;color:' + (b.net >= 0 ? "#4A7A3F" : "#C1442E") + ';">' +
                (b.net < 0 ? "− " : "") + tl(Math.abs(b.net)) + " ₺</span></div>" +
            "</div>" +
            '<div class="card card-pad">' +
              '<div class="prod-name" style="margin-bottom:4px;">Naylon / Çift Parası</div>' +
              '<div style="font-size:12px;color:#A89878;margin-bottom:10px;line-height:1.4;">Sadece bu ortakçı için geçerli. Onun kasasından düşülür, senin payına eklenir.</div>' +
              '<div class="add-row">' +
                '<input id="ortakNaylonInput" inputmode="decimal" placeholder="0" value="' + (naylon ? formatInput(String(naylon).replace(".", ",")) : "") + '">' +
                '<button class="btn-small" id="ortakNaylonKaydetBtn">Kaydet</button>' +

  function sezonTotals(ledger) {
    var satis = ledger.filter(function (t) { return t.tip === "satis"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var bakiye = ledger.filter(function (t) { return t.tip === "bakiye"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var odeme = ledger.filter(function (t) { return t.tip === "odeme"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var isci = ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "isci"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var kira = ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "kira"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var ilac = ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "ilac"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var fide = ledger.filter(function (t) { return t.tip === "gider" && t.giderTur === "fide"; }).reduce(function (s, t) { return s + t.tutar; }, 0);
    var gider = isci + kira + ilac + fide;
    return { satis: satis, bakiye: bakiye, odeme: odeme, isci: isci, kira: kira, ilac: ilac, fide: fide, gider: gider, kalan: satis + bakiye - odeme - gider };
  }

          }).join("")) +
        "</div>";
      }
      return (

          "</div>" +
          '<div style="font-size:12px;color:#A89878;margin-bottom:8px;">Arşiv tarihi: ' + esc(s.tarih) + "</div>" +
          '<div class="line"><span class="lbl">Satış</span><span class="val">' + tl(t.satis) + " ₺</span></div>" +
          (t.bakiye !== 0 ? '<div class="line" style="margin-top:4px;"><span class="lbl">Devreden Bakiye</span><span class="val">' + (t.bakiye < 0 ? "− " : "") + tl(Math.abs(t.bakiye)) + " ₺</span></div>" : "") +
          '<div class="line" style="margin-top:4px;"><span class="lbl">Alınan Ödeme</span><span class="val muted">− ' + tl(t.odeme) + " ₺</span></div>" +
          (t.gider > 0 ? '<div class="line" style="margin-top:4px;"><span class="lbl">Giderler (İşçi/Kira/İlaç/Fide)</span><span class="val muted">− ' + tl(t.gider) + " ₺</span></div>" : "") +
          '<div class="hr" style="margin:8px 0;"></div>' +
          '<div class="line"><span class="lbl" style="font-weight:700;">Kalan</span><span style="font-weight:700;color:' + (t.kalan >= 0 ? "#4A7A3F" : "#C1442E") + ';">' + (t.kalan < 0 ? "− " : "") + tl(Math.abs(t.kalan)) + " ₺</span></div>" +
          '<button class="btn-small" style="margin-top:10px;width:100%;" data-toggle-sezon="' + s.id + '">' + (acik ? "Detayı Gizle" : "Detayı Göster") + "</button>" +
          detayHtml +

      );
    }).join("");

  function ayAnahtari(trTarih) {
    var parts = String(trTarih || "").split(".");
    if (parts.length !== 3) return trTarih;
    return parts[1] + "." + parts[2];
  }
  function ayEtiketi(key) {
    var parts = key.split(".");
    var aylar = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    var idx = parseInt(parts[0], 10) - 1;
    return (aylar[idx] || parts[0]) + " " + String(parts[1]).slice(2);
  }
  function drawBarsOnCanvas(canvasId, items, opts) {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (items.length === 0) {
      ctx.fillStyle = "#A89878";
      ctx.font = "13px -apple-system";
      ctx.fillText("Henüz veri yok", 10, h / 2);
      return;
    }

    var maxVal = Math.max.apply(null, items.map(function (it) { return Math.abs(it.value); })) || 1;
    var padding = 20;
    var barAreaW = w - padding * 2;
    var barAreaH = h - 34;
    var gap = (opts && opts.gap) || 12;
    var barW = (barAreaW - gap * (items.length - 1)) / items.length;

    items.forEach(function (it, i) {
      var barH = (Math.abs(it.value) / maxVal) * (barAreaH - 16);
      var x = padding + i * (barW + gap);
      var y = barAreaH - barH + 6;
      ctx.fillStyle = it.color || "#C1442E";
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, barW, barH, 4); ctx.fill(); }
      else { ctx.fillRect(x, y, barW, barH); }

      ctx.fillStyle = "#2B2118";
      ctx.font = "9px -apple-system";
      ctx.textAlign = "center";
      ctx.fillText(kgFmt(Math.round(it.value)), x + barW / 2, Math.max(y - 5, 10));

      ctx.fillStyle = "#5C4A34";
      ctx.font = "10px -apple-system";
      ctx.fillText(it.label, x + barW / 2, barAreaH + 18);
    });
  }

  function drawKasaChart() {
    var map = {};
    state.ledger.filter(function (t) { return t.tip === "satis"; }).forEach(function (t) {
      var k = ayAnahtari(t.tarih);
      map[k] = (map[k] || 0) + t.tutar;
    });
    var keys = Object.keys(map).sort(function (a, b) {
      var pa = a.split("."), pb = b.split(".");
      return new Date(parseInt(pa[1], 10), parseInt(pa[0], 10) - 1, 1) - new Date(parseInt(pb[1], 10), parseInt(pb[0], 10) - 1, 1);
    });
    keys = keys.slice(-6);
    var items = keys.map(function (k) { return { label: ayEtiketi(k), value: map[k], color: "#C1442E" }; });
    drawBarsOnCanvas("kasaChart", items);
  }

  function sonSezon() {
    return state.sezonlar.length > 0 ? state.sezonlar[0] : null;
  }

  function drawSezonKarsilastirma() {
    var son = sonSezon();
    var buSezon = sezonTotals(state.ledger);
    var gecenSezon = son ? sezonTotals(son.ledger) : { satis: 0, gider: 0, odeme: 0, kalan: 0 };

    drawBarsOnCanvas("chartSatis", [
      { label: "Bu Sezon", value: buSezon.satis, color: "#4A7A3F" },
      { label: "Geçen Sezon", value: gecenSezon.satis, color: "#A89878" }
    ]);
    drawBarsOnCanvas("chartGider", [
      { label: "Bu Sezon", value: buSezon.gider + buSezon.odeme, color: "#C1442E" },
      { label: "Geçen Sezon", value: gecenSezon.gider + gecenSezon.odeme, color: "#A89878" }
    ]);
    drawBarsOnCanvas("chartKalan", [
      { label: "Bu Sezon", value: buSezon.kalan, color: "#4A7A3F" },
      { label: "Geçen Sezon", value: gecenSezon.kalan, color: "#A89878" }
    ]);

    var buFiyat = ortalamaKgFiyati(state.ledger);
    var gecenFiyat = son ? ortalamaKgFiyati(son.ledger) : 0;
    drawBarsOnCanvas("chartFiyat", [
      { label: "Bu Sezon", value: buFiyat, color: "#E8A33D" },
      { label: "Geçen Sezon", value: gecenFiyat, color: "#A89878" }
    ]);
  }

  function ortalamaKgFiyati(ledger) {
    var toplamTutar = 0, toplamKg = 0;
    ledger.filter(function (t) { return t.tip === "satis" && t.kg; }).forEach(function (t) {
      toplamTutar += (t.fiyat || 0) * t.kg;
      toplamKg += t.kg;
    });
    return toplamKg > 0 ? toplamTutar / toplamKg : 0;
  }

  function urunKarsilastirmaListesi() {
    var son = sonSezon();
    var buMap = {}, gecenMap = {};
    state.ledger.filter(function (t) { return t.tip === "satis"; }).forEach(function (t) {
      var k = t.grup || "Diğer";
      buMap[k] = (buMap[k] || 0) + t.tutar;
    });
    if (son) {
      son.ledger.filter(function (t) { return t.tip === "satis"; }).forEach(function (t) {
        var k = t.grup || "Diğer";
        gecenMap[k] = (gecenMap[k] || 0) + t.tutar;
      });
    }
    var tumAdlar = Array.from(new Set(Object.keys(buMap).concat(Object.keys(gecenMap))));
    return tumAdlar.map(function (ad) {
      return { ad: ad, bu: buMap[ad] || 0, gecen: gecenMap[ad] || 0 };
    }).sort(function (a, b) { return (b.bu + b.gecen) - (a.bu + a.gecen); }).slice(0, 8);
  }

  function renderGrafikler() {
    var son = sonSezon();
    var urunListesi = urunKarsilastirmaListesi();
    var maxUrunVal = Math.max.apply(null, urunListesi.map(function (u) { return Math.max(u.bu, u.gecen); })) || 1;

    var urunBarsHtml = urunListesi.length === 0
      ? '<div class="empty-note">Henüz ürün satışı yok.</div>'
      : urunListesi.map(function (u) {
          var buPct = Math.round((u.bu / maxUrunVal) * 100);
          var gecenPct = Math.round((u.gecen / maxUrunVal) * 100);
          return (
            '<div style="margin-bottom:12px;">' +
              '<div style="font-size:13px;font-weight:600;color:#2B2118;margin-bottom:4px;">' + esc(u.ad) + "</div>" +
              '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">' +
                '<div style="width:62px;font-size:10px;color:#5C4A34;">Bu sezon</div>' +
                '<div style="flex:1;background:#EDE6D6;border-radius:4px;height:14px;overflow:hidden;"><div style="width:' + buPct + '%;background:#4A7A3F;height:100%;"></div></div>' +
                '<div style="width:70px;font-size:11px;text-align:right;color:#2B2118;">' + tl(u.bu) + " ₺</div>" +
              "</div>" +
              '<div style="display:flex;align-items:center;gap:6px;">' +
                '<div style="width:62px;font-size:10px;color:#5C4A34;">Geçen sezon</div>' +
                '<div style="flex:1;background:#EDE6D6;border-radius:4px;height:14px;overflow:hidden;"><div style="width:' + gecenPct + '%;background:#A89878;height:100%;"></div></div>' +
                '<div style="width:70px;font-size:11px;text-align:right;color:#2B2118;">' + tl(u.gecen) + " ₺</div>" +
              "</div>" +
            "</div>"
          );
        }).join("");

    return (
      '<div class="content">' +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:8px;">📅 Aylık Satış Trendi (Bu Sezon)</div>' +
          '<canvas id="kasaChart" width="300" height="150" style="width:100%;height:150px;display:block;"></canvas>' +
        "</div>" +
        (son ? "" : '<div class="empty-note">Sezon karşılaştırması için Kasa Defterim\'de "Yeni Sezona Geç" ile en az bir sezonu arşivlemen gerekiyor. Aşağıdaki grafikler o zaman dolacak.</div>') +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:8px;">💵 Toplam Satış (Bu Sezon / Geçen Sezon)</div>' +
          '<canvas id="chartSatis" width="300" height="150" style="width:100%;height:150px;display:block;"></canvas>' +
        "</div>" +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:8px;">🧾 Toplam Gider (Ödeme + İşçi + Kira + İlaç-Gübre + Fide)</div>' +
          '<canvas id="chartGider" width="300" height="150" style="width:100%;height:150px;display:block;"></canvas>' +
        "</div>" +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:8px;">⚖️ Net Kalan Bakiye</div>' +
          '<canvas id="chartKalan" width="300" height="150" style="width:100%;height:150px;display:block;"></canvas>' +
        "</div>" +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:8px;">💰 Ortalama ₺/kg Fiyatı</div>' +
          '<canvas id="chartFiyat" width="300" height="150" style="width:100%;height:150px;display:block;"></canvas>' +
        "</div>" +
        '<div class="card card-pad">' +
          '<div class="prod-name" style="margin-bottom:10px;">📦 Ürün Bazlı Kazanç Karşılaştırması</div>' +
          urunBarsHtml +
        "</div>" +
      "</div>"
    );
  }

  function csvKacir(v) {
    return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  }
  function disaAktarCSV() {
    if (state.ledger.length === 0) { alert("Aktarılacak kayıt yok."); return; }
    var header = ["Tarih", "Tür", "Açıklama/Ürün", "Kalite", "Kg", "Fiyat (₺/kg)", "Komisyon %", "Tutar (₺)"];
    var sirali = state.ledger.slice().sort(function (a, b) { return a.id < b.id ? 1 : -1; });
    var lines = [header.map(csvKacir).join(",")];
    sirali.forEach(function (t) {
      var tur = t.tip === "satis" ? "Satış" : (t.tip === "bakiye" ? "Devreden Bakiye" : (t.tip === "gider" ? (GIDER_ETIKET[t.giderTur] || "Gider") : "Ödeme Alındı"));
      var aciklama = t.tip === "satis" ? t.grup : t.aciklama;
      lines.push([
        t.tarih, tur, aciklama,
        t.tip === "satis" ? (t.kalite || "") : "",
        t.tip === "satis" && t.kg ? kgFmt(t.kg) : "",
        t.tip === "satis" && t.fiyat ? tl(t.fiyat) : "",
        t.tip === "satis" && t.oran ? t.oran : "",
        tl(t.tutar)
      ].map(csvKacir).join(","));
    });
    var csv = "\uFEFF" + lines.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "hal-kasa-defteri-" + todayISO() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function printReceipt(id) {
    var t = state.ledger.find(function (x) { return x.id === id; });
    if (!t) return;
    var rows = [];
    if (t.tip === "satis") {
      rows.push(["Ürün", esc(t.grup)]);
      if (t.kalite && t.kalite !== "Standart") rows.push(["Kalite", esc(t.kalite)]);
      if (t.kg) rows.push(["Miktar", kgFmt(t.kg) + " kg"]);
      if (t.fiyat) rows.push(["Birim Fiyat", tl(t.fiyat) + " ₺/kg"]);
      if (t.tutarBrut) rows.push(["Brüt Tutar", tl(t.tutarBrut) + " ₺"]);
      if (t.oran) rows.push(["Komisyon (%" + t.oran + ")", "− " + tl(t.komisyon || 0) + " ₺"]);
    } else {
      rows.push(["Açıklama", esc(t.aciklama)]);
    }
    var baslik = t.tip === "satis" ? "Müstahsil Makbuzu" : (t.tip === "bakiye" ? "Devreden Bakiye Fişi" : (t.tip === "gider" ? ((GIDER_ETIKET[t.giderTur] || "Gider") + " Fişi") : "Ödeme Fişi"));
    var html =
      "<h2>KomisyonCep</h2>" +
      '<div class="rp-sub">' + baslik + " · " + esc(t.tarih) + "</div>" +
      "<table>" +
      rows.map(function (r) {
        return "<tr><td class=\"rp-label\">" + r[0] + "</td><td class=\"rp-val\">" + r[1] + "</td></tr>";
      }).join("") +
      '<tr class="rp-total"><td>' + (t.tip === "satis" ? "Net (üreticiye)" : "Tutar") + "</td><td>" + tl(t.tutar) + " ₺</td></tr>" +
      "</table>";
    document.getElementById("receiptPrint").innerHTML = html;
    window.print();
  }

  function urunEkle() {
    var ad = state.yeniUrunAd.trim();
    if (!ad) return;
    var exists = state.urunler.some(function (u) { return u.toLowerCase() === ad.toLowerCase(); });
    if (!exists) { state.urunler.push(ad); persistUrunler(); }
    state.yeniUrunAd = "";
    render();
  }
  function urunSil(ad) {
    state.urunler = state.urunler.filter(function (u) { return u !== ad; });
    persistUrunler();
    render();
  }

  function yeniSezonaGec() {
    if (state.ledger.length === 0) {
      alert("Kaydedilecek bir kasa hareketi yok.");
      return;
    }
    var ok = confirm("Yeni sezona geçilsin mi? Mevcut kasa defteri 'Geçmiş Sezonlar'a kaydedilip temizlenecek, kalan bakiyen yeni sezona devredecek.");
    if (!ok) return;
    var varsayilanAd = "Sezon " + bugun();
    var ad = prompt("Bu sezona bir isim ver:", varsayilanAd);
    if (ad === null) return;
    var adFinal = ad.trim() || varsayilanAd;
    var carry = sezonTotals(state.ledger).kalan;
    var sezon = { id: uid(), ad: adFinal, tarih: bugun(), ledger: state.ledger };
    state.sezonlar = [sezon].concat(state.sezonlar);
    persistSezonlar();
    state.ledger = carry !== 0
      ? [{ id: uid(), tip: "bakiye", tarih: bugun(), aciklama: "Devreden bakiye (" + adFinal + ")", tutar: carry }]
      : [];
    persistLedger();
    render();
  }

  function silSezon(id) {
    var ok = confirm("Bu sezon arşivini kalıcı olarak silmek istiyor musun?");
    if (!ok) return;
    state.sezonlar = state.sezonlar.filter(function (s) { return s.id !== id; });
    persistSezonlar();
    render();
  }

  /* ---------- EVENTS ---------- */

  function bindEvents() {
    var menuBtn = document.getElementById("menuBtn");
    if (menuBtn) menuBtn.addEventListener("click", function () { state.drawerOpen = true; render(); });

    var overlay = document.getElementById("overlay");
    if (overlay) overlay.addEventListener("click", function () { state.drawerOpen = false; render(); });

    var drawerItems = document.querySelectorAll(".drawer-item");
    drawerItems.forEach(function (btn) {
      var hedef = btn.getAttribute("data-view");
      if (!hedef) return; // çıkış butonu: görünüm değiştirmez
      btn.addEventListener("click", function () {
        state.view = hedef;
        state.drawerOpen = false;
        render();
      });
    });
    var cikisBtn = document.getElementById("cikisBtn");
    if (cikisBtn) cikisBtn.addEventListener("click", cikisYap);

    if (state.view === "calc") {
      document.querySelectorAll("select.urun-select").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var rowId = sel.getAttribute("data-row");
          var row = state.rows.find(function (r) { return r.id === rowId; });
          if (row) row.urun = sel.value;
          render();
        });
      });
      document.querySelectorAll("select.kalite-select").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var rowId = sel.getAttribute("data-row");
          var row = state.rows.find(function (r) { return r.id === rowId; });
          if (row) row.kalite = sel.value;
        });
      });
      document.querySelectorAll(".date-input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var rowId = inp.getAttribute("data-row");
          var row = state.rows.find(function (r) { return r.id === rowId; });
          if (row) row.tarih = inp.value;
        });
      });
      document.querySelectorAll(".field-input").forEach(function (inp) {
        inp.addEventListener("input", function () {
          var rowId = inp.getAttribute("data-row");
          var field = inp.getAttribute("data-field");
          var formatted = formatInput(inp.value);
          inp.value = formatted;
          var row = state.rows.find(function (r) { return r.id === rowId; });
          if (row) { row[field] = formatted; updateRowDisplay(rowId); }
        });
      });
      document.querySelectorAll("[data-remove-row]").forEach(function (btn) {
        btn.addEventListener("click", function () { removeRow(btn.getAttribute("data-remove-row")); });
      });
      var addRowBtn = document.getElementById("addRowBtn");
      if (addRowBtn) addRowBtn.addEventListener("click", addRow);
      var kaydetBtn = document.getElementById("kaydetBtn");
      if (kaydetBtn) kaydetBtn.addEventListener("click", kaydetFis);
    }

    if (state.view === "kasa") {
      var odemeToggleBtn = document.getElementById("odemeToggleBtn");
      if (odemeToggleBtn) odemeToggleBtn.addEventListener("click", function () { state.odemeOpen = !state.odemeOpen; render(); });
      var odemeTutarInput = document.getElementById("odemeTutarInput");
      if (odemeTutarInput) odemeTutarInput.addEventListener("input", function () {
        var formatted = formatInput(odemeTutarInput.value);
        odemeTutarInput.value = formatted;
        state.odemeTutar = formatted;
      });
      var odemeAciklamaInput = document.getElementById("odemeAciklamaInput");
      if (odemeAciklamaInput) odemeAciklamaInput.addEventListener("input", function () {
        state.odemeAciklama = odemeAciklamaInput.value;
      });
      var odemeKaydetBtn = document.getElementById("odemeKaydetBtn");
      if (odemeKaydetBtn) odemeKaydetBtn.addEventListener("click", odemeKaydet);
      var bakiyeToggleBtn = document.getElementById("bakiyeToggleBtn");
      if (bakiyeToggleBtn) bakiyeToggleBtn.addEventListener("click", function () { state.bakiyeOpen = !state.bakiyeOpen; render(); });
      var bakiyeTutarInput = document.getElementById("bakiyeTutarInput");
      if (bakiyeTutarInput) bakiyeTutarInput.addEventListener("input", function () {
        var formatted = formatInput(bakiyeTutarInput.value);
        bakiyeTutarInput.value = formatted;
        state.bakiyeTutar = formatted;
      });
      var bakiyeAciklamaInput = document.getElementById("bakiyeAciklamaInput");
      if (bakiyeAciklamaInput) bakiyeAciklamaInput.addEventListener("input", function () {
        state.bakiyeAciklama = bakiyeAciklamaInput.value;
      });
      var bakiyeKaydetBtn = document.getElementById("bakiyeKaydetBtn");
      if (bakiyeKaydetBtn) bakiyeKaydetBtn.addEventListener("click", bakiyeKaydet);
      var giderToggleBtn = document.getElementById("giderToggleBtn");
      if (giderToggleBtn) giderToggleBtn.addEventListener("click", function () { state.giderOpen = !state.giderOpen; render(); });
      var giderTurSelect = document.getElementById("giderTurSelect");
      if (giderTurSelect) giderTurSelect.addEventListener("change", function () { state.giderTur = giderTurSelect.value; });
      var giderTutarInput = document.getElementById("giderTutarInput");
      if (giderTutarInput) giderTutarInput.addEventListener("input", function () {
        var formatted = formatInput(giderTutarInput.value);
        giderTutarInput.value = formatted;
        state.giderTutar = formatted;
      });
      var giderAciklamaInput = document.getElementById("giderAciklamaInput");
      if (giderAciklamaInput) giderAciklamaInput.addEventListener("input", function () {
        state.giderAciklama = giderAciklamaInput.value;
      });
      var giderKaydetBtn = document.getElementById("giderKaydetBtn");
      if (giderKaydetBtn) giderKaydetBtn.addEventListener("click", giderKaydet);
      document.querySelectorAll("[data-del-txn]").forEach(function (btn) {
        btn.addEventListener("click", function () { silTxn(btn.getAttribute("data-del-txn")); });
      });
      document.querySelectorAll("[data-print-txn]").forEach(function (btn) {
        btn.addEventListener("click", function () { printReceipt(btn.getAttribute("data-print-txn")); });
      });
      var yeniSezonBtn = document.getElementById("yeniSezonBtn");
      if (yeniSezonBtn) yeniSezonBtn.addEventListener("click", yeniSezonaGec);
      var disaAktarBtn = document.getElementById("disaAktarBtn");
      if (disaAktarBtn) disaAktarBtn.addEventListener("click", disaAktarCSV);
    }

    if (state.view === "urunler") {
      var yeniUrunInput = document.getElementById("yeniUrunInput");
      if (yeniUrunInput) yeniUrunInput.addEventListener("input", function () { state.yeniUrunAd = yeniUrunInput.value; });
      if (yeniUrunInput) yeniUrunInput.addEventListener("keydown", function (e) { if (e.key === "Enter") urunEkle(); });
      var urunEkleBtn = document.getElementById("urunEkleBtn");
      if (urunEkleBtn) urunEkleBtn.addEventListener("click", urunEkle);
      document.querySelectorAll("[data-del-urun]").forEach(function (btn) {
        btn.addEventListener("click", function () { urunSil(btn.getAttribute("data-del-urun")); });
      });
    }

    if (state.view === "gecmis") {
      document.querySelectorAll("[data-toggle-sezon]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-toggle-sezon");
          state.sezonAcikId = (state.sezonAcikId === id) ? null : id;
          render();
        });
      });
      document.querySelectorAll("[data-del-sezon]").forEach(function (btn) {
        btn.addEventListener("click", function () { silSezon(btn.getAttribute("data-del-sezon")); });
      });
    }

    if (state.view === "grafikler") {
      drawKasaChart();
      drawSezonKarsilastirma();
    }

    if (state.view === "ortaklik") {
      document.querySelectorAll("[data-ortak-ac]").forEach(function (kart) {
        kart.addEventListener("click", function () {
          state.acikOrtakciEposta = kart.getAttribute("data-ortak-ac");
          state.ayarMesaj = "";
          render();
        });
      });
      var geriBtn = document.getElementById("ortakGeriBtn");
      if (geriBtn) geriBtn.addEventListener("click", function () {
        state.acikOrtakciEposta = null;
        state.ayarMesaj = "";
        render();
      });
      var oNaylonBtn = document.getElementById("ortakNaylonKaydetBtn");
      if (oNaylonBtn) {
        var oNaylonInp = document.getElementById("ortakNaylonInput");
        oNaylonInp.addEventListener("input", function () { oNaylonInp.value = formatInput(oNaylonInp.value); });
        oNaylonBtn.addEventListener("click", function () {
          if (!state.naylonlar) state.naylonlar = {};
          state.naylonlar[state.acikOrtakciEposta] = parseNum(oNaylonInp.value);
          state.ayarMesaj = "Naylon / çift parası kaydedildi.";
          buluteKaydet(true);
          render();
        });
      }
    }

    if (state.view === "ayarlar") {
      rolSecenekleriniBagla("ayarRol", function (v) {
        if (state.rol === v) return;
        state.rol = v;
        state.ayarMesaj = "Hesap türü güncellendi.";
        if (v === "tek") { state.bagliEposta = ""; state.karsiTaraf = null; }
        buluteKaydet(true);
        render();
      });

      var bagliBtn = document.getElementById("bagliKaydetBtn");
      if (bagliBtn) bagliBtn.addEventListener("click", function () {
        var inp = document.getElementById("bagliEpostaInput");
        var deger = String(inp.value || "").trim().toLowerCase();
        if (deger && deger.indexOf("@") === -1) {
          state.ayarMesaj = "Geçerli bir e-posta yaz.";
          render(); return;
        }
        state.bagliEposta = deger;
        state.ayarMesaj = deger ? "Bağlantı kaydedildi." : "Bağlantı kaldırıldı.";
        buluteKaydet(true).then(function () {
          return karsiTarafiYukle();
        }).then(function () { render(); });
        render();
      });

      var adBtn = document.getElementById("adKaydetBtn");
      if (adBtn) {
        var adInp = document.getElementById("adInput");
        adBtn.addEventListener("click", function () {
          state.ad = String(adInp.value || "").trim();
          state.ayarMesaj = "Ad kaydedildi.";
          buluteKaydet(true);
          render();
        });
      }
      var birimD = document.getElementById("birimDonum");
      var birimH = document.getElementById("birimHektar");
      if (birimD) birimD.addEventListener("click", function () {
        if (state.araziBirim === "dönüm") return;
        state.araziBirim = "dönüm"; buluteKaydet(true); render();
      });
      if (birimH) birimH.addEventListener("click", function () {
        if (state.araziBirim === "hektar") return;
        state.araziBirim = "hektar"; buluteKaydet(true); render();
      });
      var araziBtn = document.getElementById("araziKaydetBtn");
      if (araziBtn) {
        var araziInp = document.getElementById("araziInput");
        araziInp.addEventListener("input", function () { araziInp.value = formatInput(araziInp.value); });
        araziBtn.addEventListener("click", function () {
          state.arazi = parseNum(araziInp.value);
          state.ayarMesaj = "Arazi büyüklüğü kaydedildi.";
          buluteKaydet(true);
          render();
        });
      }
    }
  }

  startApp();
})();
</script>
